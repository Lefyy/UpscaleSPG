services:
  python-api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    container_name: upscale-python-api
    ports:
      - "8000:8000"
    volumes:
      - images_data:/opt/upscale/app/images
      - ./app/scripts/weights:/opt/upscale/app/scripts/weights:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  java-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upscale-java-backend
    depends_on:
      python-api:
        condition: service_healthy
    environment:
      APP_UPSCALE_API_URL: http://python-api:8000/upscale
    ports:
      - "8080:8080"
    volumes:
      - images_data:/opt/upscale/app/images

volumes:
  images_data: